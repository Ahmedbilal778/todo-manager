{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        {% block title %}{% endblock title %}
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="{% url "homepage" %}">
                <img src="{% static "image/images.png" %}" alt="todoManager" height="30" width="30">
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link active" href="{% url "homepage" %}">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="{% url "todolist" %}">TodoList</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="{% url "contact" %}">Contact_US</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url "about" %}">Aboutus</a>
                    </li>

                </ul>
            </div>

            {% if user.is_authenticated %}

                <div class="d-flex">

                    <div class="p-2 text-light">
                        Welcome, {{ user.username }}
                    </div>

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-danger ms-2" type="submit">
                            Logout
                        </button>
                    </form>

                </div>

            {% else %}

                <a href="{% url 'register' %}" class="text-decoration-none text-light">
                    <button class="btn btn-primary m-1" type="button">
                        Sign Up
                    </button>
                </a>

                <a href="{% url 'login' %}" class="text-decoration-none text-light">
                    <button class="btn btn-success" type="button">
                        Login
                    </button>
                </a>

            {% endif %}

        </div>
    </nav>

    <div class="container mt-5">
        <h2>
            {% block headline %}{% endblock headline %}
        </h2>
    </div>

    {% block content %}{% endblock content %}

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrVZcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

</body>
</html>
